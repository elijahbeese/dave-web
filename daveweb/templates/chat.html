{% extends "base.html" %}
{% block title %}Chat — D.A.V.E.{% endblock %}
{% block body %}
<div class="shell">
  <nav class="topnav">
    <div class="brand">D.A.V.E.</div>
    <div class="links">
      <a href="{{ url_for('dashboard') }}">dashboard</a>
      <a href="{{ url_for('zero_days') }}">zero-days</a>
      <a href="{{ url_for('news') }}">news</a>
      <a href="{{ url_for('pulse') }}">pulse</a>
      <a href="{{ url_for('chat') }}" class="active">chat</a>
      <a href="{{ url_for('logout') }}">logout</a>
    </div>
  </nav>

  <main class="content chat-content">
    <div id="log" class="chat-log"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="Ask D.A.V.E. anything..." autocomplete="off" autofocus>
      <button type="submit">Send</button>
    </form>
  </main>
</div>

<script>
const log = document.getElementById('log');
const form = document.getElementById('chat-form');
const input = document.getElementById('chat-input');

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMsg('user', question);
  input.value = '';
  addMsg('dave pending', 'thinking...');
  const pending = log.lastElementChild;

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question}),
    });
    const data = await resp.json();
    pending.remove();
    addMsg('dave', data.answer || data.error || '(no response)');
  } catch (err) {
    pending.remove();
    addMsg('dave error', 'Request failed: ' + err);
  }
});
</script>
{% endblock %}
